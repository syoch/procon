server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	return 404;
}

server {
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;
	server_name _;

	ssl_reject_handshake on;
}

server {
	listen 80;
	listen [::]:80;
	server_name procon.syoch.org;

	return 301 https://procon.syoch.org$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name procon.syoch.org;

	ssl_certificate /etc/letsencrypt/live/procon.syoch.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/procon.syoch.org/privkey.pem;

	# キャッシュ更新はローカル (systemd の procon-cache-refresh.timer) からしか
	# 叩けない。タイマは nginx を経由せず 127.0.0.1:3000 を直叩きする。
	# 末尾スラッシュは SvelteKit が 308 でリダイレクトするので ~* で許容して弾く
	location ~* ^/api/cache-refresh/?$ {
		return 404;
	}

	# localhost だと /etc/hosts の順序で [::1] を先に試し、接続拒否が毎件 error ログに出る
	location / {
		proxy_pass http://127.0.0.1:3000;
	}
}