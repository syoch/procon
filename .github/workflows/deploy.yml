name: build-and-deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11.27.0
          package_json_file: app/package.json
          cache_dependency_path: app/pnpm-lock.yaml
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: pnpm check
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11.27.0
          package_json_file: app/package.json
          cache_dependency_path: app/pnpm-lock.yaml
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: pnpm test
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm test

  # 1 検索にかかる時間の回帰を見るのが目的のジョブ。
  #
  # 記録用の基準ファイルは持たない。代わりに **base と head を同じランナー上で
  # 2 回測って比べる**。CPU も Node も実行環境も同じなので、差分はそのまま PR の変更による
  # ものとして読める。git に基準値を持つと runner ごとの差と
  # PR 同士で基準ファイルの衝突も起きる。
  #
  # 検出したいのは O(E x C) -> O(E) のような計算量の変化（数倍）だけなので、
  # 許容倍率は 1.5 のまま緩めにしている。BENCH_TOLERANCE で調整できる。
  #
  # ただし「同じランナー・同じ実行環境」でも、2 回の計測が同一の状態だったとは限らない。
  # 共有ランナーの負荷は不安定なので、これを検出するのが**校正ゲート**である。
  # アプリに依存しない固定仕事量の整数演算を 2 回の計測の直前に 1 回ずつ測り、
  # その 2 つの時間が 1 ± 0.10 の外なら比較不成立（exit 2）として扱い、
  # 「性能が悪化した」とは報告しない。ジョブをもう一度動かせば解決する、という扱いにする。
  #
  # **step の判定条件は変えない**。exit 2 でもジョブは落とす（回帰検出を黙って止めるのは
  # 禁物なので、落ちたことを見つけてもう一度走ってもらう）。exit 2 の中身は
  # 「性能が悪い」ではなく「機械の速度が動かなかった」なので、中身を見れば区別できる。
  bench:
    runs-on: ubuntu-latest
    steps:
      # 比較する 2 つの作業ディレクトリを用意する
      - uses: actions/checkout@v4
        with:
          path: head

      - uses: actions/checkout@v4
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.27.0
          package_json_file: head/app/package.json
          cache_dependency_path: head/app/pnpm-lock.yaml
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: 依存関係をインストール
        working-directory: head/app
        run: pnpm install --frozen-lockfile

      - name: base 側にも依存関係を入れる
        working-directory: base/app
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          # bench は jsconfig.json が extends している .svelte-kit/tsconfig.json を参照する。
          # install を --ignore-scripts にしたので svelte-kit sync が走らないので、明示的に実行する。
          pnpm exec svelte-kit sync

      # bench が main にあるかどうかで 3 通りに分かれる。
      #   A. base に bench が無い  -> この PR で bench を入れたので比較しない（正常）
      #   B. bench が両側同じ     -> 必ず比較する。base の計測が落ちたらこれは失敗
      #   C. bench が base と違う  -> PR が計測ハーネスを変えたので比較しない（明示表示）
      # 「base の計測が落ちても比較をスキップして緑にする」のは禁物。
      # 緑に見えるのに回帰を検出していない状態は、検証されていないより悪い。
      - name: base に bench があるか確認する
        id: base_has_bench
        run: |
          if [ -f base/app/bench/compare.mjs ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 計測ハーネスは両側とも各 checkout が持つものを使う。
      # head の bench を base にコピーすると、bench の import 先パスが base の app/src に対して
      # 解決される。app/src 配下のモジュールを移動しただけで（性能的には中立でも）base のビルドが
      # 失敗し、その PR が完全にブロックされてしまう。
      #
      # コピーの代わりに同一性を検証する。ハーネスが違えば「比較する意味がない」ので、
      # 暗黙の緑にせず ::notice:: で明示する。これを満たさないと、PR がハーネスを弱めても
      # base も同じハーネスで動いて差分がゼロになり、「コードが速くなった」と「計測が弱くなった」を区別できない。
      - name: bench が base と同一か判定する
        id: harness_drift
        if: steps.base_has_bench.outputs.exists == 'true'
        run: |
          set -o pipefail
          # .build はビルド生成物なので比較対象から除外する。
          if diff -rq -x .build head/app/bench base/app/bench > "${{ runner.temp }}/bench-drift.txt" 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::bench は base と同一なので性能を比較します"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "changed=true"
              echo "diff<<DIFF_EOF"
              cat "${{ runner.temp }}/bench-drift.txt"
              echo "DIFF_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "::warning::bench が base と異なるため性能の比較をスキップします"
          fi

      - name: 基準となる sha を控える
        id: refs
        run: |
          {
            echo "base_sha=${{ github.event.pull_request.base.sha || github.event.before }}"
            echo "head_sha=${{ github.event.pull_request.head.sha || github.sha }}"
          } >> "$GITHUB_OUTPUT"

      # base を bench で計測できるのは、base に bench があって、なおかつ head と同一なときだけ。
      # それ以外の 2 通りは次の通り。
      #   base に bench が無い -> 計測する bench が存在しない
      #   bench が base と違う -> 比較対象にならない
      # head は自分の bench で常に計測する（絶対値として参考になり、下の通知で提示する）。
      - name: base を計測
        id: base_bench
        if: steps.base_has_bench.outputs.exists == 'true' && steps.harness_drift.outputs.changed != 'true'
        working-directory: base/app
        continue-on-error: true
        env:
          BENCH_FIXTURE: ${{ github.workspace }}/head/app/bench/fixtures/nagaoka-central.json.gz
        run: |
          set -o pipefail
          node bench/build.mjs
          # --quiet を付けると tee する本文が空になり、job summary に数値が出なくなる。
          # 計測中の console 出力は run.ts が要約済みなので、そのまま出しても読みやすい。
          node bench/.build/bench.mjs \
            --json "${{ runner.temp }}/bench-base.json" \
            | tee "${{ runner.temp }}/bench-base.txt"

      - name: head を計測
        working-directory: head/app
        env:
          BENCH_FIXTURE: ${{ github.workspace }}/head/app/bench/fixtures/nagaoka-central.json.gz
        run: |
          set -o pipefail
          node bench/build.mjs
          node bench/.build/bench.mjs \
            --json "${{ runner.temp }}/bench-head.json" \
            | tee "${{ runner.temp }}/bench-head.txt"

      - name: 結果を比較
        if: steps.base_bench.outcome == 'success'
        working-directory: head/app
        run: |
          set -o pipefail
          # --report-on-invalid は校正が通らなかったとき（exit 2）でも回帰リストを
          # 参考値として出すためだけのフラグ。exit code は 2 のまま変わらないので、
          # 比較不成立という結論はそのまま残る。
          node bench/compare.mjs \
            --base "${{ runner.temp }}/bench-base.json" \
            --head "${{ runner.temp }}/bench-head.json" \
            --tolerance "${{ vars.BENCH_TOLERANCE || '1.5' }}" \
            --report-on-invalid \
            --format markdown \
            | tee "${{ runner.temp }}/bench-compare.md"

      # bench が base と同一で、base に bench が有るのに base の計測が落ちた場合。
      # base は自分の bench を自分の src でビルドしているので、この失敗は base 自身の破損を意味する。
      # これを黙ってスキップすると回帰検出が止まるので失敗させる。
      - name: base の計測失敗を報告する
        if: steps.base_has_bench.outputs.exists == 'true' && steps.harness_drift.outputs.changed != 'true' && steps.base_bench.outcome != 'success'
        run: |
          {
            echo "## bench"
            echo
            echo "> **base 側の計測に失敗したため、比較ができませんでした。**"
            echo
            echo "bench は base と同一で、base は自分の bench を自分の src でビルドしています。"
            echo "そのため base のビルド失敗は base 自身の破損か、依存関係の解決失敗を意味します。"
            echo
            echo "- base の依存関係が解決できていない"
            echo "- base（main）側がそれ自体が壊れている"
            echo
            echo "<details><summary>base のビルド出力</summary>"
            echo
            echo '```'
            cat "${{ runner.temp }}/bench-base.txt" 2>/dev/null || echo "(出力なし)"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::base 側の bench がビルドできないため、性能の比較が成立しませんでした"
          exit 1


      - name: 比較する意味がない旨を表示する（この PR で bench を入れた場合）
        if: steps.base_has_bench.outputs.exists != 'true'
        run: |
          {
            echo '## bench'
            echo
            echo "> base（main）に bench がまだ無いため、比較しませんでした。"
            echo "> この PR が bench を追加している場合の最初の 1 回だけです。"
            echo
            echo "head の計測値:"
            echo
            echo '```'
            cat "${{ runner.temp }}/bench-head.txt" 2>/dev/null || echo "(出力なし)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::base に bench がまだ無い（この PR で追加）ため、性能の比較はスキップしました"

      # PR が計測ハーネスを変えた場合、比較は意味がない。
      # ここで黙って緑にすると「コードが速くなった」と「計測が弱くなった」を区別できなくなるので、
      # 差分そのものが結果として表示される。
      - name: bench が base と異なる旨を表示する
        if: steps.harness_drift.outputs.changed == 'true'
        run: |
          {
            echo '## bench'
            echo
            echo "> **この PR が計測ハーネス（bench）を変更したため、性能の比較をスキップしました。**"
            echo
            echo "base と head でハーネスが違うと、性能の差とハーネスの差が混ざり"
            echo "「コードが速くなった」と「計測が弱くなった」を区別できません。"
            echo
            echo "ハーネスを変更しない PR なら性能の比較は実行されます。"
            echo "変更する場合は、その理由を PR の説明に書いてください。"
            echo
            echo "head の計測値:"
            echo
            echo '```'
            cat "${{ runner.temp }}/bench-head.txt" 2>/dev/null || echo "(出力なし)"
            echo '```'
            echo
            echo "<details><summary>base と head の bench の差分</summary>"
            echo
            echo '```'
            echo '${{ steps.harness_drift.outputs.diff }}'
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::この PR が bench を変更したため、性能の比較をスキップしました（暗黙の緑にはしません）"

      - name: 比較結果をサマリーに貼る
        if: always() && steps.base_bench.outcome == 'success'
        run: |
          {
            echo '## bench'
            echo
            echo '```'
            cat "${{ runner.temp }}/bench-compare.md" 2>/dev/null || echo "(出力なし)"
            echo '```'
            echo
            echo "<details><summary>計測したジョブの sha</summary>"
            echo ""
            echo "- base: \`${{ steps.refs.outputs.base_sha }}\`"
            echo "- head: \`${{ steps.refs.outputs.head_sha }}\`"
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 結果をアーティファクトとして保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            ${{ runner.temp }}/bench-base.json
            ${{ runner.temp }}/bench-head.json
            ${{ runner.temp }}/bench-compare.md
          if-no-files-found: warn
          retention-days: 30

  # 最大限キャッシュを活用するために、pnpm check/test の結果によらず nix ビルドは行う
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: procon-server の Nix ビルド検証
        run: nix build -L .#procon-server

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: SSH 設定
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_HOST_KEY }}" >> ~/.ssh/known_hosts

      - name: VPS 上のリポジトリを同期
        run: ssh ${{ secrets.VPS_HOST }} "git -C /srv/procon pull --ff-only"

      - name: nix run .#setup
        run: >
          ssh ${{ secrets.VPS_HOST }}
          "sudo -n /usr/bin/nix
          run
          --extra-experimental-features nix-command
          --extra-experimental-features flakes
          /srv/procon#setup"
