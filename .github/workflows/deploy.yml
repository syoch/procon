name: build-and-deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11
          package_json_file: app/package.json
          cache_dependency_path: app/pnpm-lock.yaml
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: pnpm check
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11
          package_json_file: app/package.json
          cache_dependency_path: app/pnpm-lock.yaml
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: pnpm test
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm test

  # 最大限キャッシュを活用するために、pnpm check/test の結果によらず nix ビルドは行う
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: procon-server の Nix ビルド検証
        run: nix build -L .#procon-server

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: SSH 設定
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_HOST_KEY }}" >> ~/.ssh/known_hosts

      - name: VPS 上のリポジトリを同期
        run: ssh ${{ secrets.VPS_HOST }} "git -C /srv/procon pull --ff-only"

      - name: nix run .#setup
        run: >
          ssh ${{ secrets.VPS_HOST }}
          "sudo -n /usr/bin/nix
          run
          --extra-experimental-features nix-command
          --extra-experimental-features flakes
          /srv/procon#setup"
