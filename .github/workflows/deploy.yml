name: build-and-deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Nix (OS 層) の変更検出 — deploy-os の実行条件
  changes:
    runs-on: ubuntu-latest
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            nix:
              - 'infra/flake.nix'
              - 'infra/flake.lock'
              - 'infra/modules/**'
              - 'infra/nixos/**'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: アプリの検証 (check)
        run: |
          pnpm install --frozen-lockfile
          pnpm check
        working-directory: app

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: NixOS コンテナ tarball のビルド
        run: |
          nix build -L ./infra#containerTarball
          # 検証記録として artifact に保存 (デプロイは VPS 上でのビルドが正)
          cp -L result/tarball/*.tar.xz procon-container.tar.xz

      - uses: actions/upload-artifact@v4
        with:
          name: container-tarball
          path: procon-container.tar.xz
          retention-days: 7

  # app 層の更新 (main マージ時、毎回)
  deploy-app:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: SSH 設定
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_HOST_KEY }}" >> ~/.ssh/known_hosts
      - name: アプリ更新デプロイ
        run: ssh ${{ secrets.VPS_HOST }} "sudo /srv/procon/infra/procon-app-deploy.sh"

  # OS 層の更新 (Nix 設定変更時のみ)
  # tarball は VPS 上 (導入済み Nix) でビルドされるため転送は不要。
  # build ジョブは flake 評価・ビルドの検証を兼ねる。
  deploy-os:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.nix == 'true'
    needs: [changes, build]
    runs-on: ubuntu-latest
    steps:
      - name: SSH 設定
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_HOST_KEY }}" >> ~/.ssh/known_hosts
      - name: コンテナ更新デプロイ (VPS 上で git pull + Nix ビルド + import)
        run: ssh ${{ secrets.VPS_HOST }} "sudo /srv/procon/infra/procon-container-deploy.sh"
