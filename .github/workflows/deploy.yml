name: build-and-deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # PR / main のチェック: アプリ検証 + procon-server の Nix ビルド検証
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: アプリの検証 (check)
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm check

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: procon-server の Nix ビルド検証
        run: nix build -L .#procon-server

  # main への push: VPS 上で同期 + nix run .#setup (nginx・unit・アプリを一括反映)
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: SSH 設定
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_HOST_KEY }}" >> ~/.ssh/known_hosts

      - name: VPS 上のリポジトリを同期
        run: ssh ${{ secrets.VPS_HOST }} "git -C /srv/procon pull --ff-only"

      - name: nix run .#setup
        run: >
          ssh ${{ secrets.VPS_HOST }}
          "sudo -n /nix/var/nix/profiles/default/bin/nix
          run
          --extra-experimental-features nix-command
          --extra-experimental-features flakes
          /srv/procon#setup"
